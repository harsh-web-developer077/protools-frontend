<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Base64 Encoder/Decoder - All Free Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/tools-theme.css" data-protools-theme="true">
</head>
<body class="bg-slate-50">
  <main class="max-w-3xl mx-auto mt-10 p-6">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-2xl font-bold text-slate-800 mb-2">Base64 Encoder/Decoder</h2>
      <p class="text-slate-500 mb-6">Encode text to Base64 format.</p>
      
    <textarea id="b64in" rows="3" class="w-full p-3 border border-slate-300 rounded mb-4" placeholder="Text to encode..."></textarea>
    <button onclick="document.getElementById('b64out').value = btoa(document.getElementById('b64in').value)" class="bg-blue-600 text-white px-4 py-2 rounded">Encode</button>
    <textarea id="b64out" rows="3" class="w-full p-3 border border-slate-300 rounded mt-4" placeholder="Result..."></textarea>
  
    </div>
  </main>
  <script src="../js/main.js"></script>
</body>
</html>
