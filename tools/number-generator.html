<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../css/ambient.css"></head>
<body>
    <header><a href="../index.html" class="logo">AmbientTools</a></header>
    <div class="container">
        <div class="tool-box">
            <h2>Random Number Generator</h2>
            <input type="number" id="minVal" placeholder="Min Value (e.g. 1)" value="1">
            <input type="number" id="maxVal" placeholder="Max Value (e.g. 100)" value="100">
            <h1 id="numResult" style="margin: 20px 0; color: #58a6ff; font-size: 48px;">-</h1>
            <button onclick="genNumber()">Roll Number</button>
        </div>
    </div>
    <script>
        function genNumber() {
            let min = parseInt(document.getElementById("minVal").value);
            let max = parseInt(document.getElementById("maxVal").value);
            if(min >= max) return alert("Min must be less than Max");
            document.getElementById("numResult").innerText = Math.floor(Math.random() * (max - min + 1)) + min;
        }
    </script>
</body>
</html>
