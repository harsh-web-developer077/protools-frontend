<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extract First Page - All Free Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50">
  <main class="max-w-4xl mx-auto mt-10 p-6">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-2xl font-bold text-slate-800 mb-2">Extract First Page</h2>
      <p class="text-slate-500 mb-6">Split the first page of a PDF and save it as a new file.</p>
      
    <input type="file" id="eFile" accept="application/pdf" class="w-full p-3 border border-slate-300 rounded mb-4">
    <button onclick="extractFirst()" class="w-full bg-red-600 text-white px-4 py-3 rounded font-semibold hover:bg-red-700">Extract First Page</button>
    <script>
      
  function downloadPDF(bytes, filename) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }

      async function extractFirst() {
        const file = document.getElementById('eFile').files[0];
        if(!file) return alert('Select file.');
        
        const { PDFDocument } = PDFLib;
        const srcPdf = await PDFDocument.load(await file.arrayBuffer());
        const newPdf = await PDFDocument.create();
        
        const [firstPage] = await newPdf.copyPages(srcPdf, [0]);
        newPdf.addPage(firstPage);
        
        downloadPDF(await newPdf.save(), 'page-1.pdf');
      }
    </script>
  
    </div>
  </main>
  <script src="../js/main.js"></script>
</body>
</html>
