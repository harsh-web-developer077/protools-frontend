<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0918"><title>Account | ProTools</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#7c3aed33,transparent 42%),radial-gradient(ellipse at 90% 80%,#4f46e533,transparent 40%),#0c0918;color:#f8fafc;font-family:Inter,sans-serif}.glass{background:#ffffff0e;border:1px solid #ffffff1a;backdrop-filter:blur(16px)}.grad{background:linear-gradient(90deg,#c4b5fd,#818cf8,#67e8f9);-webkit-background-clip:text;color:transparent}.btn{background:linear-gradient(110deg,#7c3aed,#4f46e5)}.field{width:100%;padding:14px;border-radius:12px;background:#171329;border:1px solid #37304e;color:white;outline:none}.field:focus{border-color:#a78bfa}</style></head><body><header class="border-b border-white/10"><div class="max-w-5xl mx-auto px-5 h-20 flex items-center justify-between"><a href="index.html" class="text-xl font-black">Pro<span class="grad">Tools</span></a><a href="index.html" class="text-sm text-slate-400">Back to website</a></div></header><main class="max-w-md mx-auto px-5 py-12"><div class="text-center mb-8"><div class="text-violet-300 text-xs font-bold tracking-widest mb-3">YOUR PROTOOLS ACCOUNT</div><h1 class="text-4xl font-black">Welcome to <span class="grad">ProTools</span></h1><p class="text-slate-400 mt-3 text-sm">Sign in to apply coupons and manage your membership.</p></div><section class="glass rounded-3xl p-7"><div class="grid grid-cols-2 gap-2 mb-6"><button id="loginTab" class="btn rounded-xl py-3 font-bold">Log In</button><button id="signupTab" class="rounded-xl py-3 text-slate-400 font-bold">Create Account</button></div><form id="form" class="space-y-4"><div id="nameWrap" class="hidden"><label class="block text-sm mb-2" for="name">Full name</label><input id="name" class="field" maxlength="80" autocomplete="name" placeholder="Your name"></div><div><label class="block text-sm mb-2" for="email">Email address</label><input id="email" class="field" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"></div><div><label class="block text-sm mb-2" for="password">Password</label><input id="password" class="field" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="At least 8 characters"></div><button id="submit" class="btn w-full rounded-xl py-3.5 font-bold" type="submit">Log In</button><p id="message" class="text-sm min-h-5" role="status" aria-live="polite"></p></form><p class="text-xs text-slate-500 mt-4 leading-6">Your account is securely checked by the ProTools server. Never share your password.</p></section></main><script>(()=>{"use strict";const API="https://protools-backend.onrender.com/api",$=id=>document.getElementById(id);let mode="login",busy=false;const q=new URLSearchParams(location.search);let next=q.get("next")||"membership.html";if(!/^(payment|membership|tools|index)\.html(\?.*)?$/.test(next))next="membership.html";function setMode(m){mode=m;const s=m==="signup";$("nameWrap").classList.toggle("hidden",!s);$("name").required=s;$("password").autocomplete=s?"new-password":"current-password";$("loginTab").className=s?"rounded-xl py-3 text-slate-400 font-bold":"btn rounded-xl py-3 font-bold";$("signupTab").className=s?"btn rounded-xl py-3 font-bold":"rounded-xl py-3 text-slate-400 font-bold";$("submit").textContent=s?"Create Account":"Log In";$("message").textContent=""} $("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");$("form").onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$("submit").disabled=true;$("submit").textContent="Please wait...";try{const body={email:$("email").value.trim(),password:$("password").value};if(mode==="signup"){body.name=$("name").value.trim();if(body.name.length<2)throw Error("Please enter your name.")}const r=await fetch(API+"/auth/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.success||!d.token||!d.user)throw Error(d.message||"Authentication failed.");localStorage.setItem("protools_token",d.token);localStorage.setItem("protools_user",JSON.stringify(d.user));if(d.user.role==="admin"){sessionStorage.setItem("protools_admin_token",d.token);location.href="admin.html";return}location.href=next}catch(err){$("message").textContent=err.message;$("message").className="text-sm text-red-400"}finally{busy=false;$("submit").disabled=false;setMode(mode)}};const existing=localStorage.getItem("protools_token");if(existing){fetch(API+"/auth/me",{headers:{Authorization:"Bearer "+existing}}).then(r=>r.ok?r.json():null).then(d=>{if(d?.success&&d.user){if(d.user.role==="admin"){sessionStorage.setItem("protools_admin_token",existing);location.href="admin.html"}else location.href=next}}).catch(()=>{})}})();</script></body></html>
