<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keyword Combiner - All Free Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50">
  <main class="max-w-4xl mx-auto mt-10 p-6">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-2xl font-bold text-slate-800 mb-2">Keyword Combiner</h2>
      <p class="text-slate-500 mb-6">Merge lists of keywords for Google Ads or Long-tail SEO.</p>
      
    <div class="grid grid-cols-3 gap-4 mb-4">
      <textarea id="k1" rows="5" class="w-full p-2 border rounded" placeholder="List 1 (e.g. Buy)"></textarea>
      <textarea id="k2" rows="5" class="w-full p-2 border rounded" placeholder="List 2 (e.g. Shoes)"></textarea>
      <textarea id="k3" rows="5" class="w-full p-2 border rounded" placeholder="List 3 (e.g. Online)"></textarea>
    </div>
    <button onclick="combine()" class="w-full bg-blue-600 text-white py-2 rounded font-semibold mb-4">Combine Keywords</button>
    <textarea id="kOut" rows="6" class="w-full p-3 border rounded bg-slate-50" readonly placeholder="Results will appear here..."></textarea>
    <script>
      function combine() {
        let l1 = document.getElementById('k1').value.split('\n').filter(x=>x);
        let l2 = document.getElementById('k2').value.split('\n').filter(x=>x);
        let l3 = document.getElementById('k3').value.split('\n').filter(x=>x);
        if(!l1.length) l1 = ['']; if(!l2.length) l2 = ['']; if(!l3.length) l3 = [''];
        let res = [];
        l1.forEach(a => l2.forEach(b => l3.forEach(c => {
          let str = [a,b,c].filter(x=>x.trim()).join(' ');
          if(str) res.push(str);
        })));
        document.getElementById('kOut').value = res.join('\n');
      }
    </script>
  
    </div>
  </main>
  <script src="../js/main.js"></script>
</body>
</html>
