<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vowel Counter - All Free Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/tools-theme.css" data-protools-theme="true">
</head>
<body class="bg-slate-50">
  <main class="max-w-3xl mx-auto mt-10 p-6">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-2xl font-bold text-slate-800 mb-2">Vowel Counter</h2>
      <p class="text-slate-500 mb-6">Count the number of vowels in a string.</p>
      
    <input type="text" id="vIn" class="w-full p-3 border border-slate-300 rounded mb-4" placeholder="Enter text...">
    <button onclick="countV()" class="bg-blue-600 text-white px-4 py-2 rounded">Count Vowels</button>
    <h3 class="mt-4 text-xl">Vowels: <span id="vOut" class="text-blue-600 font-bold">0</span></h3>
    <script>
      function countV() {
        let m = document.getElementById('vIn').value.match(/[aeiou]/gi);
        document.getElementById('vOut').innerText = m === null ? 0 : m.length;
      }
    </script>
  
    </div>
  </main>
  <script src="../js/main.js"></script>
</body>
</html>
