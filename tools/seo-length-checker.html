<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SEO Length Checker - All Free Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50">
  <main class="max-w-4xl mx-auto mt-10 p-6">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-2xl font-bold text-slate-800 mb-2">SEO Length Checker</h2>
      <p class="text-slate-500 mb-6">Check if your Title and Meta Description are within Google limits.</p>
      
    <div class="mb-4">
      <label class="block text-slate-700 mb-1 font-semibold">Page Title (Optimal: 50-60 chars)</label>
      <input type="text" id="tIn" class="w-full p-3 border border-slate-300 rounded outline-none" oninput="checkL()">
      <p class="text-sm mt-1">Length: <span id="tCount" class="font-bold">0</span></p>
    </div>
    <div class="mb-4">
      <label class="block text-slate-700 mb-1 font-semibold">Meta Description (Optimal: 150-160 chars)</label>
      <textarea id="dIn" rows="3" class="w-full p-3 border border-slate-300 rounded outline-none" oninput="checkL()"></textarea>
      <p class="text-sm mt-1">Length: <span id="dCount" class="font-bold">0</span></p>
    </div>
    <script>
      function checkL() {
        let tLen = document.getElementById('tIn').value.length;
        let dLen = document.getElementById('dIn').value.length;
        let tC = document.getElementById('tCount');
        let dC = document.getElementById('dCount');
        tC.innerText = tLen;
        dC.innerText = dLen;
        tC.className = (tLen > 60 || tLen < 10) ? 'font-bold text-red-500' : 'font-bold text-green-500';
        dC.className = (dLen > 160 || dLen < 50) ? 'font-bold text-red-500' : 'font-bold text-green-500';
      }
    </script>
  
    </div>
  </main>
  <script src="../js/main.js"></script>
</body>
</html>
