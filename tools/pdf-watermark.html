<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add PDF Watermark - All Free Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50">
  <main class="max-w-4xl mx-auto mt-10 p-6">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-2xl font-bold text-slate-800 mb-2">Add PDF Watermark</h2>
      <p class="text-slate-500 mb-6">Stamp text across all pages in your document.</p>
      
    <input type="file" id="wFile" accept="application/pdf" class="w-full p-3 border border-slate-300 rounded mb-4">
    <input type="text" id="wText" placeholder="Watermark Text (e.g. CONFIDENTIAL)" class="w-full p-3 border border-slate-300 rounded mb-4">
    <button onclick="addWatermark()" class="w-full bg-red-600 text-white px-4 py-3 rounded font-semibold hover:bg-red-700">Add Watermark</button>
    <script>
      
  function downloadPDF(bytes, filename) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }

      async function addWatermark() {
        const file = document.getElementById('wFile').files[0];
        const text = document.getElementById('wText').value;
        if(!file || !text) return alert('Provide file and text.');
        
        const { PDFDocument, rgb, degrees } = PDFLib;
        const pdf = await PDFDocument.load(await file.arrayBuffer());
        const pages = pdf.getPages();
        
        pages.forEach(page => {
          const { width, height } = page.getSize();
          page.drawText(text, {
            x: width / 4,
            y: height / 2,
            size: 50,
            color: rgb(0.95, 0.1, 0.1),
            opacity: 0.3,
            rotate: degrees(45),
          });
        });
        
        downloadPDF(await pdf.save(), 'watermarked.pdf');
      }
    </script>
  
    </div>
  </main>
  <script src="../js/main.js"></script>
</body>
</html>
