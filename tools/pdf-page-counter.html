<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Page Counter - All Free Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50">
  <main class="max-w-4xl mx-auto mt-10 p-6">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-2xl font-bold text-slate-800 mb-2">PDF Page Counter</h2>
      <p class="text-slate-500 mb-6">Find out exactly how many pages are in a PDF file.</p>
      
    <input type="file" id="cFile" accept="application/pdf" class="w-full p-3 border border-slate-300 rounded mb-4">
    <button onclick="countPages()" class="w-full bg-red-600 text-white px-4 py-3 rounded font-semibold hover:bg-red-700">Count Pages</button>
    <h3 class="mt-6 text-center text-2xl font-bold text-slate-800">Total Pages: <span id="pCount" class="text-red-600">0</span></h3>
    <script>
      async function countPages() {
        const file = document.getElementById('cFile').files[0];
        if(!file) return;
        const { PDFDocument } = PDFLib;
        const pdf = await PDFDocument.load(await file.arrayBuffer());
        document.getElementById('pCount').innerText = pdf.getPageCount();
      }
    </script>
  
    </div>
  </main>
  <script src="../js/main.js"></script>
</body>
</html>
