<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RGB to HEX Converter - All Free Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/tools-theme.css" data-protools-theme="true">
</head>
<body class="bg-slate-50">
  <main class="max-w-3xl mx-auto mt-10 p-6">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-2xl font-bold text-slate-800 mb-2">RGB to HEX Converter</h2>
      <p class="text-slate-500 mb-6">Convert RGB color codes to HEX.</p>
      
    <div class="flex gap-2 mb-4">
      <input type="number" id="r" class="w-1/3 p-3 border border-slate-300 rounded" placeholder="R (0-255)">
      <input type="number" id="g" class="w-1/3 p-3 border border-slate-300 rounded" placeholder="G (0-255)">
      <input type="number" id="b" class="w-1/3 p-3 border border-slate-300 rounded" placeholder="B (0-255)">
    </div>
    <button onclick="toHex()" class="w-full bg-blue-600 text-white px-4 py-3 rounded">Convert to HEX</button>
    <div class="mt-4 flex items-center gap-4">
      <h3 class="text-2xl font-bold text-slate-800" id="hexOut">#000000</h3>
      <div id="colBox" class="w-10 h-10 rounded border" style="background: #000;"></div>
    </div>
    <script>
      function toHex() {
        let r = parseInt(document.getElementById('r').value).toString(16).padStart(2,'0');
        let g = parseInt(document.getElementById('g').value).toString(16).padStart(2,'0');
        let b = parseInt(document.getElementById('b').value).toString(16).padStart(2,'0');
        let hex = "#" + r + g + b;
        document.getElementById('hexOut').innerText = hex.toUpperCase();
        document.getElementById('colBox').style.background = hex;
      }
    </script>
  
    </div>
  </main>
  <script src="../js/main.js"></script>
</body>
</html>
